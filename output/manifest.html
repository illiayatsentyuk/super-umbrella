<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Маніфест змішування. Тема 2026." />
    <title>Маніфест, Мікс світів</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body data-page="manifest" data-base="./">
    <a class="skip" href="#content">До вмісту</a>
    <div id="site-header"></div>

<main id="content" tabindex="-1">
      <div class="manifest">
        <section class="section manifest__intro">
          <div class="wrap" data-reveal>
            <h1 class="manifest__title">Маніфест змішування</h1>
            <p class="lead prose">
              Збери кадр з двох світів, які зазвичай не зустрічаються. Можна змішати епоху з
              матеріалом або культуру з вигадкою. Шов між ними має бути видно.
            </p>
            <p class="prose manifest__next">
              Один точний збіг важить більше за купу ефектів без характеру.
            </p>
          </div>
        </section>

        <section id="pryntsypy" class="section principles">
          <div class="wrap">
            <div data-reveal>
              <p class="kicker">Орієнтири</p>
              <h2>На що дивитися в роботі</h2>
            </div>
            <ol class="principles__list" id="principles-list"></ol>
          </div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="./js/content.js"></script>
    <script src="./js/site.js"></script>
    <script src="./js/components/header.js"></script>
    <script src="./js/components/footer.js"></script>
    <script src="./js/components/principles.js"></script>
    <script src="./js/manifest.js"></script>
    <script src="./js/boot.js"></script>
  </body>
</html>
